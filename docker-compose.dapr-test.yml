version: '3.9'

# Lightweight local proof of the Phase 5 event-driven pipeline:
# Redpanda (Kafka-compatible broker) + Dapr sidecars + consumer microservices.
# Not meant to mirror production topology (no K8s, no auth) -
# it isolates and proves the pub/sub mechanism itself with minimal RAM.

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: dapr-test-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=400M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    networks:
      - dapr-test

  notification-service:
    build:
      context: ./services/notification-service
    container_name: dapr-test-notification
    ports:
      - "8002:8002"
      - "3502:3500"
    environment:
      - APP_PORT=8002
      - DAPR_HTTP_PORT=3500
      - DAPR_PUBSUB_NAME=taskpubsub
      - REMINDERS_TOPIC=reminders
      - TASK_UPDATES_TOPIC=task-updates
      - LOG_LEVEL=INFO
    networks:
      - dapr-test
    depends_on:
      - redpanda

  notification-service-dapr:
    image: daprio/daprd:1.13.6
    container_name: dapr-test-notification-sidecar
    command:
      - "./daprd"
      - "-app-id"
      - "notification-service"
      - "-app-port"
      - "8002"
      - "-dapr-http-port"
      - "3500"
      - "-resources-path"
      - "/components"
      - "-log-level"
      - "info"
    volumes:
      - ./dapr-local-test/components:/components
    network_mode: "service:notification-service"
    depends_on:
      - notification-service
      - redpanda

  recurring-task-service:
    build:
      context: ./services/recurring-task-service
    container_name: dapr-test-recurring
    ports:
      - "8003:8003"
      - "3503:3500"
    environment:
      - PORT=8003
      - DAPR_HTTP_PORT=3500
      - PUBSUB_NAME=taskpubsub
      - TASK_EVENTS_TOPIC=task-events
      - BACKEND_APP_ID=backend
      - LOG_LEVEL=INFO
    networks:
      - dapr-test
    depends_on:
      - redpanda

  recurring-task-service-dapr:
    image: daprio/daprd:1.13.6
    container_name: dapr-test-recurring-sidecar
    command:
      - "./daprd"
      - "-app-id"
      - "recurring-task-service"
      - "-app-port"
      - "8003"
      - "-dapr-http-port"
      - "3500"
      - "-resources-path"
      - "/components"
      - "-log-level"
      - "info"
    volumes:
      - ./dapr-local-test/components:/components
    network_mode: "service:recurring-task-service"
    depends_on:
      - recurring-task-service
      - redpanda

  audit-service:
    build:
      context: ./services/audit-service
    container_name: dapr-test-audit
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8004:8004"
      - "3504:3500"
    environment:
      - PORT=8004
      - DAPR_HTTP_PORT=3500
      - PUBSUB_NAME=taskpubsub
      - TOPIC_NAME=task-events
      - LOG_LEVEL=INFO
      # Set DATABASE_URL to your local Postgres, reachable via host.docker.internal
      # (not "localhost" - that resolves to the container itself).
      # If auth fails, check pg_hba.conf: loopback connections may use "trust"
      # while docker-network connections require the real password.
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:5432/todo
    networks:
      - dapr-test
    depends_on:
      - redpanda

  audit-service-dapr:
    image: daprio/daprd:1.13.6
    container_name: dapr-test-audit-sidecar
    command:
      - "./daprd"
      - "-app-id"
      - "audit-service"
      - "-app-port"
      - "8004"
      - "-dapr-http-port"
      - "3500"
      - "-resources-path"
      - "/components"
      - "-log-level"
      - "info"
    volumes:
      - ./dapr-local-test/components:/components
    network_mode: "service:audit-service"
    depends_on:
      - audit-service
      - redpanda

  websocket-service:
    build:
      context: ./services/websocket-service
    container_name: dapr-test-websocket
    ports:
      - "8005:8005"
      - "3505:3500"
    environment:
      - PORT=8005
      - DAPR_HTTP_PORT=3500
      - DAPR_PUBSUB_NAME=taskpubsub
      - DAPR_TOPIC=task-updates
      - LOG_LEVEL=INFO
    networks:
      - dapr-test
    depends_on:
      - redpanda

  websocket-service-dapr:
    image: daprio/daprd:1.13.6
    container_name: dapr-test-websocket-sidecar
    command:
      - "./daprd"
      - "-app-id"
      - "websocket-service"
      - "-app-port"
      - "8005"
      - "-dapr-http-port"
      - "3500"
      - "-resources-path"
      - "/components"
      - "-log-level"
      - "info"
    volumes:
      - ./dapr-local-test/components:/components
    network_mode: "service:websocket-service"
    depends_on:
      - websocket-service
      - redpanda

networks:
  dapr-test:
    driver: bridge
